services:
  postgres:
    image: postgres:latest
    restart: always
    container_name: cogni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cogni-local
      TZ: America/Sao_Paulo
    ports:
      - '5442:5432'
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
    driver: local
